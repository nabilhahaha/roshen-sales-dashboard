<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roshen / Relia Supply Chain</title>
  <meta name="description" content="Roshen / Relia Supply Chain — procurement, delivery, receiving and inventory.">
  <!-- PWA: installable, standalone, offline shell (sw.js) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#101a2b">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Supply Chain">
  <link rel="stylesheet" href="./src/styles/app.css">
  <!-- Restore the saved theme before first paint to avoid a flash. -->
  <script>
    try { var t = localStorage.getItem('rr-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <!-- Libraries loaded as globals; ES modules wrap them via window.* -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <!-- pdf.js for reading uploaded supplier invoice PDFs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
</head>
<body>
  <div id="app">
    <div class="app-boot">
      <div class="app-boot-logo">🏭</div>
      <div class="app-boot-name">Roshen <span>/</span> Relia</div>
      <div class="app-boot-sub">Supply Chain</div>
      <div class="app-boot-bar"><span></span></div>
    </div>
  </div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
